<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickPrint — Create your shop account</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff,#faf5ff);min-height:100vh}</style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl border border-slate-100 max-w-md w-full p-7">
    <div class="text-center mb-5">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white flex items-center justify-center text-2xl shadow-lg mb-3">🖨️</div>
      <h1 class="text-xl font-black text-slate-900">Create your shop account</h1>
      <p class="text-xs text-slate-500 mt-1">Customers will scan your QR and print — no app install needed</p>
    </div>

    <div class="space-y-3 text-left">
      <div><label class="block text-xs font-bold text-slate-600 mb-1">Shop name *</label>
        <input id="shopName" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-violet-600 outline-none font-bold text-sm" placeholder="e.g. Suprajaa Textiles"></div>
      <div><label class="block text-xs font-bold text-slate-600 mb-1">Owner username *</label>
        <input id="username" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-violet-600 outline-none font-bold text-sm" placeholder="e.g. suprajaa_txt"></div>
      <div><label class="block text-xs font-bold text-slate-600 mb-1">Password *</label>
        <input id="password" type="password" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-violet-600 outline-none font-bold text-sm" placeholder="Choose a strong password"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-bold text-slate-600 mb-1">Phone</label>
          <input id="phone" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-violet-600 outline-none font-bold text-sm" placeholder="9876543210"></div>
        <div><label class="block text-xs font-bold text-slate-600 mb-1">UPI ID</label>
          <input id="upiId" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-violet-600 outline-none font-bold text-sm" placeholder="shop@upi"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-bold text-slate-600 mb-1">B&W rate (₹/page)</label>
          <input id="bwRate" type="number" value="3" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-violet-600 outline-none font-bold text-sm"></div>
        <div><label class="block text-xs font-bold text-slate-600 mb-1">Color rate (₹/page)</label>
          <input id="colorRate" type="number" value="10" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-200 focus:border-violet-600 outline-none font-bold text-sm"></div>
      </div>
    </div>

    <div id="msg" class="text-xs font-bold text-center mt-3 min-h-[18px] opacity-0 transition-opacity"></div>

    <button id="btn" onclick="signup()" class="w-full mt-4 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-black text-sm shadow-lg transition active:scale-98">
      Create shop &amp; get QR
    </button>

    <div class="mt-4 pt-3 border-t border-slate-100 text-center text-xs text-slate-500">
      Already have an account? <a href="/owner" class="text-violet-600 font-extrabold hover:underline">Log in</a>
    </div>
  </div>

  <script>
    async function signup() {
      const g = id => document.getElementById(id).value.trim();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn');
      const payload = {
        shopName: g('shopName'), username: g('username'), password: g('password'),
        phone: g('phone'), upiId: g('upiId'),
        bwRate: g('bwRate') || 3, colorRate: g('colorRate') || 10
      };
      if (!payload.shopName || !payload.username || !payload.password) {
        msg.textContent = 'Shop name, username and password are required.';
        msg.className = 'text-xs font-bold text-rose-600 text-center mt-3 min-h-[18px] opacity-100';
        return;
      }
      btn.disabled = true; btn.textContent = 'Creating...';
      msg.style.opacity = '0';
      try {
        const r = await fetch('/api/owner/signup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Signup failed');
        localStorage.setItem('qp_owner_token', d.token);
        msg.textContent = 'Shop created! Your QR is ready. Redirecting to owner console...';
        msg.className = 'text-xs font-bold text-emerald-600 text-center mt-3 min-h-[18px] opacity-100';
        setTimeout(() => { window.location.href = '/owner?token=' + encodeURIComponent(d.token); }, 1200);
      } catch (e) {
        msg.textContent = e.message;
        msg.className = 'text-xs font-bold text-rose-600 text-center mt-3 min-h-[18px] opacity-100';
      } finally {
        btn.disabled = false; btn.textContent = 'Create shop & get QR';
      }
    }
  </script>
</body>
</html>
