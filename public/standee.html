<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR se Print - Counter Standee Poster</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <!-- html2canvas for high-res PNG downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #e2e8f0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Print styles for exact A4 paper fit */
    @media print {
      body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .poster-wrap {
        border: none !important;
        box-shadow: none !important;
        width: 100% !important;
        max-width: 100% !important;
        height: 100vh !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      @page {
        size: A4 portrait;
        margin: 6mm;
      }
    }

    /* Serrated / Brush style edge for yellow Automatic Print badge */
    .brush-banner {
      background: #ffcc00;
      position: relative;
      clip-path: polygon(
        3% 0%, 97% 0%, 
        100% 20%, 98% 35%, 100% 50%, 97% 65%, 100% 80%, 97% 100%, 
        3% 100%, 
        0% 80%, 3% 65%, 0% 50%, 2% 35%, 0% 20%
      );
    }

    /* Ribbon chevron edge */
    .ribbon-banner {
      background: #003399;
      clip-path: polygon(
        2.5% 0%, 97.5% 0%, 
        100% 50%, 
        97.5% 100%, 2.5% 100%, 
        0% 50%
      );
    }

    .sunburst-ray {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }
    .sunburst-ray span {
      display: inline-block;
      width: 4px;
      height: 14px;
      background: #0052cc;
      border-radius: 99px;
    }
    .sunburst-ray span:nth-child(1) { transform: rotate(-25deg); height: 11px; }
    .sunburst-ray span:nth-child(2) { transform: rotate(0deg); height: 16px; }
    .sunburst-ray span:nth-child(3) { transform: rotate(25deg); height: 11px; }
  </style>
</head>
<body>

  <!-- Floating Action Buttons (Hidden when printing) -->
  <div class="no-print mb-6 flex flex-wrap items-center justify-center gap-3 bg-white p-3 rounded-2xl shadow-xl border border-slate-300">
    <button onclick="window.print()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-sm shadow-md flex items-center gap-2 transition active:scale-95">
      <span>🖨️ Print Poster (A4)</span>
    </button>
    <button onclick="downloadPosterImage()" id="btn-download-poster" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow-md flex items-center gap-2 transition active:scale-95">
      <span>📥 Download Poster Image (PNG)</span>
    </button>
    <button onclick="downloadOnlyQrImage()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm flex items-center gap-2 transition">
      <span>QR மட்டும் பதிவிறக்குக</span>
    </button>
    <a href="/admin.html" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm flex items-center gap-2 transition">
      <span>← Back to Admin</span>
    </a>
  </div>

  <!-- ============================================================ -->
  <!-- 🌟 STAND-EE POSTER (EXACT MATCH TO THE UPLOADED DESIGN)     -->
  <!-- ============================================================ -->
  <div id="poster-capture-area" class="poster-wrap bg-white w-full max-w-[560px] rounded-3xl border-4 border-[#002b66] shadow-2xl flex flex-col justify-between text-center overflow-hidden relative">

    <!-- TOP: LOGO HEADER & RAYS -->
    <div class="pt-6 px-6">
      
      <!-- Brand Logo: QR se Print -->
      <div class="flex items-center justify-center gap-2">
        <!-- Left Sunburst Rays -->
        <div class="sunburst-ray">
          <span></span><span></span><span></span>
        </div>

        <div class="flex items-baseline font-black leading-none tracking-tight select-none">
          <span class="text-[52px] text-[#0a192f] font-black tracking-tighter" style="font-family:'Montserrat',sans-serif;">QR</span>
          <span class="text-[30px] text-[#0a192f] font-black mx-1.5 lowercase">se</span>
          
          <!-- Print Word with Printer Icon on Top of "i" -->
          <div class="relative inline-block">
            <!-- Printer Icon on top -->
            <div class="absolute -top-7 left-1/2 -translate-x-1/2 text-[#002b66]">
              <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24">
                <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
              </svg>
            </div>
            <span class="text-[56px] text-[#0052cc] font-black" style="font-family:'Montserrat',sans-serif; text-shadow: 2px 2px 0px #fff;">Print</span>
          </div>
        </div>

        <!-- Right Sunburst Rays -->
        <div class="sunburst-ray">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Blue Ribbon Banner: SCAN • UPLOAD • PAY • PRINT -->
      <div class="ribbon-banner mt-3 py-2 px-6 text-white text-center shadow-md">
        <span class="text-[17px] sm:text-[18px] font-black tracking-widest uppercase">
          SCAN <span class="text-yellow-400 font-bold mx-1.5">•</span> 
          UPLOAD <span class="text-yellow-400 font-bold mx-1.5">•</span> 
          PAY <span class="text-yellow-400 font-bold mx-1.5">•</span> 
          PRINT
        </span>
      </div>
    </div>

    <!-- MIDDLE: 3-WAY PROCESS & GIANT QR CODE -->
    <div class="my-5 px-4 sm:px-6">
      
      <!-- Flex container with Left Step, Center QR, Right Step -->
      <div class="flex items-center justify-center gap-2 sm:gap-3">
        
        <!-- STEP 1: SCAN (Left Side) -->
        <div class="flex flex-col items-center">
          <div class="w-[105px] sm:w-[115px] bg-white border-2 border-[#0052cc] rounded-2xl p-2.5 sm:p-3 text-center shadow-sm">
            <div class="w-10 h-10 mx-auto rounded-full bg-[#0052cc] text-white flex items-center justify-center text-lg mb-1 shadow-sm">
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zm-4-12h-2v2h2V7zm-2 4h2v2h-2v-2zm-2-4H7v2h2V7zm0 4H7v2h2v-2zm4 4h-2v2h2v-2zm-4 0H7v2h2v-2z"/>
              </svg>
            </div>
            <div class="text-[13px] font-black text-[#0052cc] uppercase leading-tight">1. SCAN</div>
            <div class="text-[10px] font-bold text-slate-700 leading-tight mt-0.5">QR Code Scan செய்யவும்</div>
          </div>
        </div>

        <!-- Blue Arrow Left to Center -->
        <div class="text-[#0052cc] text-2xl font-black shrink-0">➔</div>

        <!-- CENTER: GIANT CRISP QR CODE -->
        <div class="flex flex-col items-center">
          <div class="w-[200px] h-[200px] sm:w-[220px] sm:h-[220px] bg-white rounded-3xl border-4 border-[#002b66] p-2.5 shadow-xl flex items-center justify-center relative overflow-hidden">
            <img id="standee-qr-image" class="w-full h-full object-contain" alt="QuickPrint QR Code" src="">
          </div>

          <!-- Blue Arrow pointing Down to Step 2 -->
          <div class="text-[#0052cc] text-2xl font-black my-1">⬇</div>

          <!-- STEP 2: UPLOAD & PAY (Bottom of QR) -->
          <div class="bg-white border-2 border-[#0052cc] rounded-2xl py-2 px-4 shadow-sm flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-[#0052cc] text-white flex items-center justify-center shrink-0 shadow-sm">
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
              </svg>
            </div>
            <div class="text-left">
              <div class="text-[13px] font-black text-[#0052cc] uppercase leading-tight">2. UPLOAD &amp; PAY</div>
              <div class="text-[10px] font-bold text-slate-700 leading-tight">File Upload செய்து Payment செய்யவும்</div>
            </div>
          </div>
        </div>

        <!-- Blue Arrow Center to Right -->
        <div class="text-[#0052cc] text-2xl font-black shrink-0">➔</div>

        <!-- STEP 3: PRINT (Right Side) -->
        <div class="flex flex-col items-center">
          <div class="w-[105px] sm:w-[115px] bg-white border-2 border-[#0052cc] rounded-2xl p-2.5 sm:p-3 text-center shadow-sm">
            <div class="w-10 h-10 mx-auto rounded-full bg-[#0052cc] text-white flex items-center justify-center text-lg mb-1 shadow-sm">
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
              </svg>
            </div>
            <div class="text-[13px] font-black text-[#0052cc] uppercase leading-tight">3. PRINT</div>
            <div class="text-[10px] font-bold text-slate-700 leading-tight mt-0.5">Automatic Print ஆகும்</div>
          </div>
        </div>

      </div>

    </div>

    <!-- YELLOW HIGHLIGHT BANNER: AUTOMATIC PRINT -->
    <div class="px-6 my-2">
      <div class="brush-banner py-2 px-5 flex items-center justify-center gap-3 text-slate-950 shadow-md">
        <!-- Accent Rays -->
        <div class="text-xl font-black">\\\</div>
        
        <!-- Printer Icon -->
        <svg class="w-7 h-7 fill-current shrink-0" viewBox="0 0 24 24">
          <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
        </svg>

        <span class="text-[24px] sm:text-[28px] font-black tracking-wide uppercase font-sans">
          AUTOMATIC PRINT
        </span>

        <!-- Accent Rays -->
        <div class="text-xl font-black">///</div>
      </div>

      <!-- Payment Sub-title -->
      <div class="mt-2 text-[15px] sm:text-[16px] font-black text-slate-900 tracking-tight">
        Pay Online Or Pay Cash Option Available
      </div>
    </div>

    <!-- BOTTOM FOOTER: AVAILABLE ONLY AT [SHOP NAME] -->
    <div class="bg-[#002244] text-white py-4 px-6 mt-4">
      <div class="text-[11px] font-extrabold tracking-widest uppercase text-slate-300">
        AVAILABLE ONLY AT
      </div>
      <div class="flex items-center justify-center gap-2 mt-1">
        <!-- Yellow Pin -->
        <span class="text-2xl text-yellow-400">📍</span>
        <span id="standee-shop-name" class="text-[24px] sm:text-[28px] font-black text-yellow-400 tracking-tight leading-tight">
          Hasulots technologies
        </span>
      </div>
      <div id="standee-phone-wrap" class="text-xs text-slate-400 mt-1 font-semibold" style="display:none;">
        📞 Help: <span id="standee-phone"></span>
      </div>
    </div>

  </div>

  <script>
    async function loadStandee() {
      try {
        const sid = new URLSearchParams(location.search).get('shop') || '';
        const res = await fetch('/api/info?shop=' + encodeURIComponent(sid));
        const data = await res.json();
        
        const settings = data.settings || {};
        const shopName = settings.shopName || data.shopId || 'QuickPrint Shop';
        
        document.getElementById('standee-shop-name').textContent = shopName;
        
        if (settings.shopPhone) {
          const phWrap = document.getElementById('standee-phone-wrap');
          const ph = document.getElementById('standee-phone');
          if (phWrap && ph) {
            ph.textContent = settings.shopPhone;
            phWrap.style.display = 'block';
          }
        }

        // Target customer order URL
        let link = data.orderUrl || `${window.location.origin}/order`;
        if (data.baseUrl && data.baseUrl.startsWith('https://')) {
          link = `${data.baseUrl}/order`;
        }

        // Generate Ultra-Crisp High-Res QR (600x600 for sharp printing)
        const qrRes = await fetch(`/api/qr?text=${encodeURIComponent(link)}&width=600`);
        const qrData = await qrRes.json();
        const qrImg = document.getElementById('standee-qr-image');
        if (qrImg) qrImg.src = qrData.qr;

        // Auto print trigger if requested
        if (new URLSearchParams(location.search).get('autoPrint') === 'true') {
          setTimeout(() => {
            window.print();
          }, 800);
        }
      } catch (err) {
        console.error('Failed to load standee details:', err);
      }
    }

    // High-Resolution PNG Poster Download
    async function downloadPosterImage() {
      const btn = document.getElementById('btn-download-poster');
      const origText = btn ? btn.innerHTML : '';
      if (btn) btn.innerHTML = '⏳ Generating PNG...';

      try {
        const posterEl = document.getElementById('poster-capture-area');
        if (!posterEl) return;

        // Use html2canvas with scale 3 for 300DPI crisp print resolution
        const canvas = await html2canvas(posterEl, {
          scale: 3,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false
        });

        const imageUri = canvas.toDataURL('image/png');
        const shopTitle = (document.getElementById('standee-shop-name')?.textContent || 'Shop')
          .replace(/[^a-zA-Z0-9]/g, '_');

        const a = document.createElement('a');
        a.href = imageUri;
        a.download = `QR-se-Print-Poster-${shopTitle}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        alert('Poster download failed: ' + err.message);
      } finally {
        if (btn) btn.innerHTML = origText;
      }
    }

    // Download only the raw QR code image
    function downloadOnlyQrImage() {
      const img = document.getElementById('standee-qr-image');
      if (img && img.src) {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = 'QuickPrint-Shop-QR.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } else {
        alert('QR code not ready yet.');
      }
    }

    window.addEventListener('DOMContentLoaded', loadStandee);
  </script>
</body>
</html>
