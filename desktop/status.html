<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>QuickPrint Shop</title>
<style>
*{margin:0;box-sizing:border-box}
body{font-family:Segoe UI,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#a855f7);color:#fff;text-align:center;padding:24px}
.c{background:#ffffff1f;border:1px solid #ffffff40;border-radius:24px;padding:40px 36px;max-width:440px;backdrop-filter:blur(6px)}
h1{font-size:24px;margin:14px 0 8px}p{opacity:.9;line-height:1.5;font-size:15px}
.sp{width:46px;height:46px;border:5px solid #ffffff55;border-top-color:#fff;border-radius:50%;margin:0 auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{margin-top:22px;padding:12px 26px;border:0;border-radius:12px;font-weight:700;font-size:15px;background:#fff;color:#4f46e5;cursor:pointer}
.big{font-size:44px}.hidden{display:none}
</style></head><body><div class="c">
<div id="loading"><div class="sp"></div><h1>Connecting to QuickPrint…</h1>
<p>First start can take up to a minute while the server wakes up. Please wait.</p></div>
<div id="offline" class="hidden"><div class="big">📡</div><h1>Can't reach QuickPrint</h1>
<p>Check the shop's internet connection, then try again.</p><button id="retry">Try again</button></div>
</div>
<script>
var offline = location.search.indexOf('offline') >= 0;
document.getElementById('loading').classList.toggle('hidden', offline);
document.getElementById('offline').classList.toggle('hidden', !offline);
document.getElementById('retry').onclick = function () { window.qpDesktop && window.qpDesktop.retry(); };
</script></body></html>
